<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>家代試菜填寫・東門國小</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .input-group { display: flex; gap: 8px; margin-top: 4px; }
        .input-group input { margin-top: 0; flex: 1; }
        .input-group button { white-space: nowrap; }
    </style>
</head>
<body>
<div class="ban"><img src="img/banner.jpg" alt="115東門國小學生家長會"></div>
<div class="w">
    <h1>📝 家代試菜紀錄填寫</h1>
    <p class="mu">感謝您協助試菜！請填寫當日紀錄，送出後將由幹部覆核發布。前台將自動隱藏您的真實姓名與班級。</p>
    
    <section class="f">
        <form id="reportForm">
            <div class="form-group">
                <label>試菜日期 <span style="color:var(--rd)">*</span></label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>您的班級 <span style="color:var(--rd)">*</span></label>
                <span class="hint">請輸入數字，如：102。系統將自動與排班表比對。</span>
                <input type="number" id="classId" placeholder="例如：102" required>
            </div>
            <div class="form-group">
                <label>今日菜色 <span style="color:var(--rd)">*</span></label>
                <div class="input-group">
                    <input type="text" id="menu" placeholder="點擊右方按鈕自動帶入官方菜單" required>
                    <button type="button" class="btn btn-outline" id="fetchMenuBtn">🪄 自動抓取</button>
                </div>
            </div>
            <div class="form-group">
                <label>意見反饋 <span style="color:var(--rd)">*</span></label>
                <span class="hint">請真實反映口感、份量或家長群意見。</span>
                <textarea id="feedback" rows="4" style="width:100%;" required></textarea>
            </div>
            <div class="form-group">
                <label>照片連結 (選填)</label>
                <span class="hint">請貼上公開的相簿或圖床網址，多張請用逗號分隔。</span>
                <input type="url" id="photoUrl" placeholder="https://...">
            </div>
            <hr style="border:0; border-top:2px dashed var(--bd); margin:20px 0;">
            <div class="form-group">
                <label>通關密語 <span style="color:var(--rd)">*</span></label>
                <span class="hint">請輸入幹部公佈的家代填寫密碼，或是超級密碼(直接發布)。</span>
                <input type="password" id="password" required>
            </div>
            
            <div style="margin-top:24px; text-align:center;">
                <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;">🚀 送出紀錄</button>
            </div>
            <div id="statusMsg" style="margin-top:16px; text-align:center; font-weight:700;"></div>
        </form>
    </section>
</div>
<script src="js/report.js"></script>
</body>
</html>
