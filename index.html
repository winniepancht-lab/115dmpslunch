<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東門國小家長會・營養午餐試菜紀錄</title>
<style>
:root{--bg:#f5f8fd;--card:#fff;--tx:#232a35;--mu:#667085;--ac:#0f4fb0;--rd:#d63a28;--bd:#dbe3f0;--ok:#237a4b;--wa:#b4590c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1b212b;--tx:#e8edf5;--mu:#98a2b3;--ac:#6ea2ff;--rd:#ff7a66;--bd:#2c3544;--ok:#6cc08c;--wa:#f0a560}}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.w{max-width:820px;margin:0 auto;padding:0 14px 48px}
.ban{background:#fff;border-radius:0 0 18px 18px;overflow:hidden;border:1px solid var(--bd);border-top:0}.ban img{display:block;width:100%;height:auto}
h1{font-size:1.45rem;margin:18px 0 4px;color:var(--ac)}h2{font-size:1.1rem;margin:26px 0 10px;padding-left:10px;border-left:4px solid var(--rd)}
.mu{color:var(--mu);font-size:.9rem}
.ext{display:flex;gap:12px;align-items:center;margin:16px 0;padding:12px 14px;background:var(--card);border:1px solid var(--ac);border-radius:14px;text-decoration:none;color:var(--tx)}
.ext b{color:var(--ac)}.ext span.go{margin-left:auto;white-space:nowrap;background:var(--ac);color:#fff;border-radius:99px;padding:3px 14px;font-size:.9rem}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 8px}
select{font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 16px;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}.tabs button.em{opacity:.5}
.st{display:flex;gap:10px;margin:14px 0}.st div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center;font-size:.85rem}.st b{display:block;font-size:1.5rem;color:var(--ac);line-height:1.3}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cal a{display:block;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;text-decoration:none;color:inherit;font-size:.82rem}
.cal a b{display:block;font-size:.95rem}.tag{display:inline-block;font-size:.7rem;border-radius:99px;padding:0 7px;margin:2px 2px 0 0;border:1px solid var(--ok);color:var(--ok)}.tag.w2{border-color:var(--wa);color:var(--wa)}
.day,.qa{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:12px 0}
.day h3{margin:0 0 6px;font-size:1.08rem;color:var(--ac)}.rep{border-top:1px dashed var(--bd);padding:8px 0}.rep strong{color:var(--rd)}
.rep ul{margin:4px 0 0;padding-left:1.2em}.ph{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.ph img{height:150px;border-radius:8px;flex:none}
.n{border-left:4px solid var(--wa);background:color-mix(in srgb,var(--wa) 10%,transparent);padding:6px 10px;margin:8px 0;border-radius:0 8px 8px 0;font-size:.93rem}.n.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.qa details{border-top:1px solid var(--bd);padding:6px 0}.qa details:first-child{border-top:0}.qa summary{cursor:pointer}.qa p{margin:6px 0 4px;font-size:.95rem}
.empty{padding:22px;text-align:center;color:var(--mu);background:var(--card);border:1px dashed var(--bd);border-radius:14px}
.foot{margin-top:30px;font-size:.82rem;color:var(--mu)}
/* 其他 */
.menu{margin:6px 0 2px;font-size:.95rem}.menu b{color:var(--ac)}.n.ph2{border-color:var(--wa)}.tag.ok2{border-color:var(--ok);color:var(--ok)}.foot a{color:var(--mu)}
.admin-btn {display: inline-block; background-color: var(--ok); color: white; padding: 6px 16px; border-radius: 99px; text-decoration: none; font-size: 0.9rem; margin-top: 6px; margin-bottom: 6px;}
.admin-btn:hover {opacity: 0.9;}
</style></head><body>
<div class="ban"><img src="img/banner.jpg" alt="115東門國小學生家長會"></div>
<div class="w">
<h1>營養午餐試菜紀錄 🍱</h1>
<p class="mu">家長代表每天到校試菜，如實記錄味道、口感與照片，並把家長的疑問轉達給學校營養師，讓大家知道孩子每天吃的午餐。</p>

<a class="ext" href="https://fatraceschool.k12ea.gov.tw/frontend/search.html?school=353606" target="_blank" rel="noopener noreferrer"><div><b>教育部校園食材登錄平台 2.0</b><br><span class="mu">查詢東門國小每日官方菜單、食材與來源</span></div><span class="go">前往查詢 ↗</span></a>

<div class="bar"><select id="sem" aria-label="學期"></select><span class="mu" id="semsum"></span></div>
<div class="tabs" id="tabs"></div>
<div id="view"><div class="empty">資料載入中…</div></div>

<p class="foot">試菜代表僅顯示年級，不公開真實姓名；照片只拍餐點。內容為家長代表的個人感受與家長會整理的摘要，非官方檢驗結果。官方菜單與食材來源請以教育部校園食材登錄平台為準。<br><a href="admin.html" rel="nofollow">家代填寫入口</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body></html>
