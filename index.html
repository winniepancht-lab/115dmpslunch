<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東門國小家長會 - 營養午餐監督紀錄</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section { background-color: #198754; color: white; padding: 2rem 0; margin-bottom: 2rem; border-radius: 0 0 20px 20px; }
        .feedback-card { border-left: 4px solid #198754; margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .nutritionist-reply { background-color: #e9ecef; border-radius: 8px; padding: 1rem; margin-top: 1rem; border-left: 4px solid #0d6efd; }
        .photo-container img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        .admin-link { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.9rem; }
        .admin-link:hover { color: white; }
    </style>
</head>
<body>

<div class="hero-section text-center">
    <div class="container">
        <h1 class="fw-bold">東門國小 營養午餐監督紀錄</h1>
        <p class="lead mb-2">家長會把關，讓孩子吃得安心、健康</p>
        <a href="admin.html" class="admin-link"><i class="bi bi-gear"></i> 家代管理後台</a>
    </div>
</div>

<div class="container mb-5">
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="card-title text-success">今日菜色 <span id="currentDate" class="fs-5 text-muted"></span></h4>
                    <p id="todayMenu" class="fs-5 mt-3">載入中...</p>
                </div>
            </div>
        </div>
    </div>

    <h3 class="mb-3">家代試菜回饋</h3>
    <div id="feedbackContainer" class="row">
        <div class="text-center text-muted py-5" id="loadingMsg">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2">正在讀取最新紀錄...</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
