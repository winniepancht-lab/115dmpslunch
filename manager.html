<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>幹部管理後台・東門國小</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .card { background:#fffdf9; border:2px solid var(--bd); border-radius:16px; padding:16px; margin-bottom:16px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
<div class="w" style="margin-top:20px;">
    <h1>🛡️ 家長會幹部管理後台</h1>
    <p class="mu">此系統需要超級密碼。資料更動將直接影響前台與 Google 試算表。</p>
    
    <div class="form-group" style="background:#fff; padding:16px; border-radius:16px; border:2px solid var(--rd);">
        <label>超級密碼 (幹部專用)</label>
        <input type="password" id="superPassword" placeholder="請先輸入超級密碼以啟用下方功能">
    </div>

    <div class="tabs" id="adminTabs" style="margin-top:20px;">
        <button class="on" data-target="tab-pending">📋 待審核清單</button>
        <button data-target="tab-roster">📅 排班表更新</button>
        <button data-target="tab-stats">📊 試菜統計</button>
    </div>

    <!-- 待審核清單 -->
    <section class="f tab-content active" id="tab-pending">
        <h2>待審核與發布</h2>
        <button class="btn btn-outline" id="loadPendingBtn" style="margin-bottom:16px;">🔄 載入最新清單</button>
        <div id="pendingContainer">
            <div class="mu text-center">請先輸入密碼並點擊載入。</div>
        </div>
    </section>

    <!-- 排班表更新 -->
    <section class="f tab-content" id="tab-roster">
        <h2>排班表 (白名單) 更新</h2>
        <p class="mu">請使用 CSV 格式貼上（例如從 Excel 複製），格式需為：<code>日期,班級,家代姓名</code>。送出後將覆蓋目前的排班表。</p>
        <textarea id="rosterData" rows="8" style="width:100%; font-family:monospace;" placeholder="2026-11-15,102,王小明爸爸
2026-11-16,509,李大華媽媽"></textarea>
        <button class="btn btn-primary" style="margin-top:12px;" id="updateRosterBtn">上傳覆蓋排班表</button>
        <div id="rosterMsg" class="mu" style="margin-top:8px;"></div>
    </section>

    <!-- 試菜統計 -->
    <section class="f tab-content" id="tab-stats">
        <h2>班級試菜達成統計</h2>
        <button class="btn btn-outline" id="loadStatsBtn" style="margin-bottom:16px;">🔄 載入統計數據</button>
        <div id="statsContainer">
            <div class="mu">點擊按鈕從總表與排班表撈取最新數據...</div>
        </div>
    </section>
</div>
<script src="js/manager.js"></script>
</body>
</html>
