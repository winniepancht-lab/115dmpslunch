<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>家代填寫入口・東門國小營養午餐</title>
<style>
:root{--bg:#f5f8fd;--card:#fff;--tx:#232a35;--mu:#667085;--ac:#0f4fb0;--rd:#d63a28;--bd:#dbe3f0;--ok:#237a4b}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--card:#1b212b;--tx:#e8edf5;--mu:#98a2b3;--ac:#6ea2ff;--rd:#ff7a66;--bd:#2c3544;--ok:#6cc08c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.w{max-width:680px;margin:0 auto;padding:14px 14px 60px}h1{font-size:1.4rem;color:var(--ac);margin:.4em 0}
h2{font-size:1.05rem;margin:0 0 8px;padding-left:9px;border-left:4px solid var(--rd)}.mu{color:var(--mu);font-size:.9rem}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:14px 0}
label{display:block;font-weight:600;margin-top:8px;font-size:.92rem}
input,textarea,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}textarea{min-height:96px}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:99px;padding:8px 26px;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>div{flex:1}#th img{height:84px;border-radius:7px;margin:6px 6px 0 0}
.msg{margin-top:8px;font-weight:600}.ok{color:var(--ok)}.er{color:var(--rd)}a{color:var(--ac)}
</style></head><body><div class="w">
<h1>家代填寫入口 ✍️</h1>
<p class="mu">送出後前台約 1–5 分鐘內更新。<b>請不要寫家長或學生姓名；照片只拍餐點。</b>　<a href="index.html">回前台</a></p>
<section><label>通關密語（幹部提供，這支手機會記住）</label><input id="key" type="password" autocomplete="off"></section>

<section><h2>1　今日試菜</h2>
<div class="row"><div><label>日期</label><input type="date" id="date"></div><div><label>班級（前台只顯示年級）</label><input id="cls" inputmode="numeric" placeholder="例如 206"></div></div>
<label>今日菜色（選填）</label><input id="menu" placeholder="例如：糙米飯、糖醋排骨、蒜炒菠菜、味噌湯">
<label>試菜心得（可直接貼 LINE 的試菜文字）</label><textarea id="fb" placeholder="白飯：軟硬適中&#10;主菜：偏鹹…"></textarea>
<label>照片（可選多張，只拍餐點）</label><input type="file" id="ph" accept="image/*" multiple><div id="th"></div>
<button id="b1">送出試菜紀錄</button><div class="msg" id="m1"></div>
<p class="mu">同一天有第二位代表，再送出一次即可。</p></section>

<section><h2>2　新增反映事項（有問題才填）</h2>
<div class="row"><div><label>日期</label><input type="date" id="qd"></div><div><label>標題</label><input id="qt" placeholder="例如：螞蟻上樹有油耗味"></div></div>
<label>反映摘要（不要寫姓名）</label><textarea id="qs"></textarea>
<label>營養師／學校回覆（還沒回覆就留空，前台會顯示「追蹤中」）</label><textarea id="qr"></textarea>
<button id="b2">送出反映事項</button><div class="msg" id="m2"></div></section>

<section><h2>3　幫「追蹤中」的反映補上回覆</h2>
<select id="pend"><option value="">載入中…</option></select>
<label>營養師／學校回覆</label><textarea id="pr"></textarea>
<button id="b3">送出回覆</button><div class="msg" id="m3"></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="js/config.js"></script><script src="js/admin.js"></script>
</body></html>
