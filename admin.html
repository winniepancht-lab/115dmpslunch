<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>家代填寫入口・東門國小營養午餐</title><link rel="stylesheet" href="css/style.css">
<style>
section.f{background:#fff;border:2px solid var(--bd);border-radius:22px;padding:12px 16px;margin:14px 0;box-shadow:0 4px 12px #f3d9b833}
section.f h2{margin-top:4px}label{display:block;font-weight:700;margin-top:8px;font-size:.92rem}
.f input,.f textarea,.f select{width:100%;padding:8px 10px;border:2px solid var(--bd);border-radius:12px;background:#fffdf9}.f textarea{min-height:96px}
.f button,.btn{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:99px;padding:8px 24px;margin:12px 8px 0 0;cursor:pointer}.f button.g{background:#fff;color:var(--ac);border:2px solid var(--ac);padding:4px 14px;margin:6px 6px 0 0;font-size:.88rem}button:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>div{flex:1}.th img{height:80px;border-radius:10px;margin:6px 6px 0 0}.msg{margin-top:8px;font-weight:700}.ok{color:#1d6b43}.er{color:#c0392b}
.rota{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.rota button{margin:0!important;padding:2px 12px!important}.rota .done{background:var(--mt)!important;color:#1d6b43!important;border-color:#8fdcae!important}
details.adm{margin:6px 0}details.adm summary{cursor:pointer;font-weight:700}
</style></head><body>
<div class="w"><h1>✏️ 家代填寫入口 <small>📷 照片會自動縮小上傳</small></h1>
<p class="mu">送出後前台約 1–5 分鐘內更新。<b>請不要寫家長或學生姓名；照片只拍餐點。</b>　<a href="index.html">回前台</a></p>
<section class="f"><label>通關密語（幹部提供，這支手機會記住）</label><input id="key" type="password" autocomplete="off"></section>

<section class="f"><h2>今日試菜</h2>
<div class="row"><div><label>日期</label><input type="date" id="date"></div><div><label>班級</label><input id="cls" inputmode="numeric" placeholder="例如 206"></div></div>
<div id="rota" class="mu"></div>
<label>今日菜色（選填）</label><input id="menu" placeholder="例如：糙米飯、糖醋排骨、蒜炒菠菜、味噌湯">
<label>菜單圖片（選填，學校公布的菜單照片）</label><input type="file" id="mp" accept="image/*" multiple><div class="th" id="mth"></div>
<label>試菜心得（可直接貼 LINE 的試菜文字）</label><button type="button" class="g" id="tpl">插入白飯／主菜／副菜／青菜／湯範本</button>
<textarea id="fb" placeholder="白飯：軟硬適中&#10;主菜：偏鹹…"></textarea>
<label>試菜照片（可多選，只拍餐點）</label><input type="file" id="ph" accept="image/*" multiple><div class="th" id="th"></div>
<button id="b1">送出試菜紀錄</button><div class="msg" id="m1"></div><p class="mu">同一天有第二位代表，再送出一次即可。</p></section>

<section class="f"><h2>新增反映事項（有問題才填）</h2>
<div class="row"><div><label>日期</label><input type="date" id="qd"></div><div><label>標題</label><input id="qt" placeholder="例如：螞蟻上樹有油耗味"></div></div>
<label>反映摘要（不要寫姓名）</label><textarea id="qs"></textarea>
<label>照片（選填，可多選）</label><input type="file" id="qp" accept="image/*" multiple><div class="th" id="qth"></div>
<label>營養師／學校回覆（還沒回覆就留空，前台會顯示「追蹤中」）</label><textarea id="qr"></textarea>
<button id="b2">送出反映事項</button><div class="msg" id="m2"></div></section>

<section class="f"><h2>幫「追蹤中」的反映補上回覆</h2>
<select id="pend"><option value="">載入中…</option></select><label>營養師／學校回覆</label><textarea id="pr"></textarea>
<button id="b3">送出回覆</button><div class="msg" id="m3"></div></section>

<section class="f"><details class="adm"><summary>📅 幹部專用：匯入輪值排班表</summary>
<p class="mu">選擇「輪值表.xlsx」和「家長代表名冊.xlsx」。檔案只在你的手機／電腦裡解析，<b>只會上傳「日期＋班級」，不會上傳任何姓名</b>。匯入後，填寫今日試菜時會顯示當天輪值班級，以及誰還沒回報。</p>
<label>輪值表（排班表）</label><input type="file" id="xs" accept=".xlsx,.xls"><label>家長代表名冊</label><input type="file" id="xr" accept=".xlsx,.xls">
<button id="b4">解析並匯入</button><div class="msg" id="m4"></div></details></section>
</div>
<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/admin.js"></script>
</body></html>
