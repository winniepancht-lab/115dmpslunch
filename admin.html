<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>幹部管理後台・東門國小營養午餐</title><link rel="stylesheet" href="css/style.css">
<style>
section.f,.rv,.card2{background:#fff;border:2px solid var(--bd);border-radius:22px;padding:12px 16px;margin:14px 0;box-shadow:0 4px 12px #f3d9b833}
.f h2{margin-top:4px}label{display:block;font-weight:700;margin-top:8px;font-size:.92rem}
.w input:not([type=checkbox]):not([type=file]),.w textarea,.w select{width:100%;padding:7px 10px;border:2px solid var(--bd);border-radius:12px;background:#fffdf9;font:inherit}textarea{min-height:90px}
.w button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:99px;padding:6px 18px;margin:8px 6px 0 0;cursor:pointer}.w button.g{background:#fff;color:var(--ac);border:2px solid var(--ac);padding:3px 12px;font-size:.88rem}.w button.r{background:var(--rd)}button:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}.th img{height:70px;border-radius:10px;margin:6px 6px 0 0}
.pks{display:flex;gap:8px;flex-wrap:wrap}.pk{width:96px;font-size:.78rem}.pk img{width:96px;height:96px;object-fit:cover;border-radius:12px;display:block}
.tb{width:100%;border-collapse:collapse;font-size:.9rem}.tb th,.tb td{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left;vertical-align:top}.tb tr.zero td{background:#fff1f1}.tb-w{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#3a3748;color:#fff;border-radius:99px;padding:8px 22px;display:none;z-index:60;max-width:90vw}#toast.er{background:#c0392b}
.badge2{background:var(--rd);color:#fff;border-radius:99px;padding:0 8px;font-size:.75rem;margin-left:4px}pre{white-space:pre-wrap;word-break:break-all;background:#fffdf9;border:2px dashed var(--bd);border-radius:12px;padding:8px;font-size:.8rem}
.tabs button{position:relative}.mini{font-size:.85rem;color:var(--mu)}
</style></head><body>
<div class="ban"><img src="img/banner.jpg" alt="115東門國小學生家長會"></div>
<div class="w"><h1>🛠️ 幹部管理後台 <small>審核・補登・議題・班表・統計</small></h1>
<section class="f" id="login"><label>通關密語</label><input id="key" type="password" autocomplete="off"><button id="lg">登入</button><div class="mu" id="lm"></div></section>
<div id="main" style="display:none"><div class="tabs" id="tabs"></div><div id="pane"></div></div></div>
<div id="toast"></div>
<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/admin.js"></script>
</body></html>
