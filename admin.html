<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>家代填寫入口・東門國小營養午餐</title><link rel="stylesheet" href="css/style.css">
</head><body>
<div class="w">
  <header>
    <h1>✏️ 家代填寫入口 <small>📷 照片會自動縮小上傳</small></h1>
    <p class="mu">送出後前台約 1–5 分鐘內更新。<b>請不要寫姓名；照片只拍餐點。</b>　<a href="index.html">回前台</a></p>
  </header>

  <section class="card"><label>通關密語（幹部提供，這支手機會記住）</label><input id="key" type="password" autocomplete="off"></section>

  <section class="card"><h2>今日試菜</h2>
    <div class="row"><div><label>日期</label><input type="date" id="date"></div><div><label>班級</label><input id="cls" inputmode="numeric" placeholder="例如 206"></div></div>
    <div id="rota" class="mu"></div>
    <label>今日菜色（系統將自動帶入）</label><input id="menu" placeholder="例如：糙米飯、糖醋排骨...">
    <label>菜單圖片（選填，可一次選取多張）</label><input type="file" id="mp" accept="image/*" multiple><div class="th" id="mth"></div>
    <label>試菜心得</label><button type="button" class="g" id="tpl">插入範本</button>
    <textarea id="fb" placeholder="白飯：軟硬適中&#10;主菜：偏鹹…"></textarea>
    <label>試菜照片（可一次選取多張只拍餐點）</label><input type="file" id="ph" accept="image/*" multiple><div class="th" id="th"></div>
    <button id="b1">送出試菜紀錄</button><div class="msg" id="m1"></div>
  </section>

  <section class="card"><h2>新增反映事項（有問題才填）</h2>
    <div class="row"><div><label>日期</label><input type="date" id="qd"></div><div><label>標題</label><input id="qt" placeholder="標題"></div></div>
    <label>反映摘要（不要寫姓名）</label><textarea id="qs"></textarea>
    <label>照片（選填，可多張）</label><input type="file" id="qp" accept="image/*" multiple><div class="th" id="qth"></div>
    <label>學校回覆（還沒回覆就留空）</label><textarea id="qr"></textarea>
    <button id="b2">送出反映事項</button><div class="msg" id="m2"></div>
  </section>

  <section class="card"><h2>幫「追蹤中」的反映補上回覆</h2>
    <select id="pend"><option value="">載入中…</option></select><label>學校回覆</label><textarea id="pr"></textarea>
    <button id="b3">送出回覆</button><div class="msg" id="m3"></div>
  </section>

  <section class="card"><details class="adm"><summary>📅 幹部專用：匯入輪值排班表</summary>
    <p class="mu">選擇檔案解析，不會上傳姓名。</p>
    <label>輪值表</label><input type="file" id="xs" accept=".xlsx,.xls"><label>名冊</label><input type="file" id="xr" accept=".xlsx,.xls">
    <button id="b4">解析並匯入</button><div class="msg" id="m4"></div></details>
  </section>

  <!-- 幹部進階管理專區 -->
  <section class="card" id="superAdminPanel">
    <h2>👑 幹部進階管理</h2>
    <p class="mu">您已啟用幹部權限，可進行議題管理。</p>
    <label>新增 / 管理特殊議題</label>
    <input type="text" id="adminIssueTitle" placeholder="輸入議題名稱">
    <textarea id="adminIssueContent" placeholder="輸入內容或進度"></textarea>
    <button id="btnSuperAdminSubmit">送出議題更新</button>
    <div class="msg" id="msgSuperAdmin"></div>
  </section>

</div>
<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/admin.js"></script>
</body></html>
